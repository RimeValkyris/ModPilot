[package]
name = "modpackpilot"
version = "0.1.0"
description = "A native desktop launcher and manager for Minecraft modpack servers"
authors = ["ModpackPilot contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "modpackpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "chrono",
    "uuid",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["rt", "macros", "sync", "fs", "process", "io-util", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
regex = "1"
walkdir = "2"
base64 = "0.22"
sysinfo = "0.32"
# rustls-tls, not the default native-tls: keeps this pure-Rust instead of
# needing OpenSSL available at build time, which is one less thing to
# install on a fresh Windows dev machine.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# The default release profile leaves real performance on the table for a
# shipped desktop binary: no LTO, one codegen unit per crate (worse cross-
# crate inlining), and debug symbols left in. This trades a slower release
# build for a smaller, faster final `.exe` - worth it since it's built once
# per release, not on every `cargo check` during development.
[profile.release]
lto = true
codegen-units = 1
strip = true

